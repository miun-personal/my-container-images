# Buildah/Podman storage configuration for rootless operation
# This configuration enforces secure storage practices for container image building

[storage]
# Use VFS driver for maximum isolation (no shared layers between builds)
# Alternative: overlay with proper permissions, but VFS is simpler and more secure
driver = "vfs"

# Temporary runtime directory - cleaned on container restart
runroot = "/tmp/containers"

# Persistent storage for built images
graphroot = "$HOME/.local/share/containers/storage"

[storage.options]
# VFS driver doesn't need mount_program

[storage.options.overlay]
# If overlay driver is used, configure securely
mountopt = "nodev,nosuid"

[storage.options.vfs]
# VFS-specific options - ignore ownership for rootless operation
ignore_chown_errors = "true"
