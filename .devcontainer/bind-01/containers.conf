# Buildah/Podman containers configuration for secure, isolated builds
# This enforces rootless operation with namespace isolation

[containers]
# Automatically use user namespaces for all builds
userns = "auto"

# Private network namespace by default (builds are isolated)
# netns = "private"

# Allow pivot_root for proper container isolation
no_pivot_root = false

# Default capabilities to drop (buildah will add back what it needs)
default_capabilities = []

# Set resource limits by default
default_ulimits = [
  "nofile=4096:8192",
  "nproc=2048:4096"
]

# Environment variables
env = [
  "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
]

# Default seccomp profile (can be overridden per build)
seccomp_profile = "$HOME/.config/containers/seccomp.json"

# Use cgroupfs for cgroup management (more compatible in containers)
[engine]
cgroup_manager = "cgroupfs"

# Event logging for audit trail
events_logger = "file"

# Network configuration
[network]
# Default network mode for builds
# network_backend = "netavark"
# network_backend = "cni"

# Service destinations
[service_destinations]
